prompts:
- '[WP] It''s 3 AM. An official phone alert wakes you up. It says "DO NOT LOOK AT
  THE MOON". You have hundreds of notifications. Hundreds of random numbers are sending
  "It''s a beautiful night tonight. Look outside."'
- '[WP] Write a short story where the first sentence has 20 words, 2nd sentence has
  19, 3rd has 18 etc. Story ends with a single word.


  [CW] Write a short story where the first sentence has 20 words, 2nd sentence has
  19, 3rd has 18 etc. Story ends with a single word'
- '[WP] Death has hourglasses for every person. One day, during a cleaning, he found
  a dust covered one that had rolled under his desk.'
- '[WP] Every human has a ''luck rating'' - a number from 1-100 that defines how lucky
  they can be. Born with a rating of 100, you''re confined in a maximum security prison.
  You think your luck should get you out easily - that is, until you see that all
  the other inmates also have luck ratings of 100.'
- "[WP] When you\u2019re 28, science discovers a drug that stops all effects of aging,\
  \ creating immortality. Your government decides to give the drug to all citizens\
  \ under 26, but you and the rest of the \u201CLost Generations\u201D are deemed\
  \ too high-risk. When you\u2019re 85, the side effects are finally discovered."
- '[WP] Your spouse has the annoying habit of unexpectedly licking you. When you ask
  them why they do it, they always reply "just so you know it''s really me." You think
  it''s nothing but a cute joke. One day, feeling something is off, you realise your
  spouse hasn''t done it in over three weeks.'
- '[WP] Eminem has to tell the history of the earth to a group of aliens in 5 minuets
  or less.


  **EDIT** I''m sorry; I spelled it wrong, it should be "in 5 minutes or less" not
  "in 5 minuets or less". '
- '[WP] Everyone with the same name shares knowledge. If one Bob gets a degree in
  electrical engineering, then all Bob''s have this knowledge readily available. Soon,
  everyone starts naming their kids similar names until factions form. Your parents
  rebelled and named you something original.'
- '[WP] "So they are a war species then, huh." The alien scratched his head: "Why
  are you interested in them. The humans, i mean." The other alien got closer. "They
  fight for peace. No war species ever fights for peace."'
- "[WP] You die and appear before the Devil and seven other individuals. They applaud\
  \ you and the Devil exclaims, \u201Cfinally, an eighth deadly sin!\u201D"
sys_prompt_1: 'You are an imaginative fiction writer who specializes in responding
  to creative writing prompts (like those found on r/WritingPrompts).



  Your task: Given a writing prompt, craft a **short story or excerpt** that:


  * Is engaging, coherent, creative, original, and vividly written.

  * Stays true to the premise of the prompt while adding depth, tension, or an unexpected
  twist.

  * Uses natural, compelling prose with strong imagery, dialogue, and characterization
  where appropriate.

  * Aims for a tone that feels like a published short story or a gripping excerpt
  from a novel.



  Additional guidelines:


  * Write in English, but adapt tone, genre, and perspective according to the prompt
  (e.g., fantasy, sci-fi, horror, comedy, slice-of-life).

  * Plan it out thoroughly before writing

  * Do not include meta-comments about writing; just output the story itself.

  '
